<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Gobble</title>
<style>
:root{color-scheme:dark;--night:#1d1024;--panel:#2b1836;--ink:#fff4e3;--muted:#cdb9d6;--marigold:#ffb627;--pumpkin:#ff6b1a;--cranberry:#e8305a}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5;
 background-image:radial-gradient(800px 460px at 10% -10%,rgba(255,107,26,.3),transparent 60%),radial-gradient(700px 460px at 100% 0,rgba(232,48,90,.25),transparent 60%);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:20px}
h1{font-family:Georgia,serif;font-size:clamp(40px,12vw,72px);line-height:1;margin:0;
 background:linear-gradient(90deg,var(--marigold),var(--pumpkin),var(--cranberry));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--muted)}
.years{display:flex;flex-direction:column;gap:12px}
a.year{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--panel);
 border:1px solid rgba(255,244,227,.14);border-left:8px solid var(--marigold);border-radius:16px;padding:18px}
a.year b{font-family:Georgia,serif;font-size:34px;color:var(--marigold)}
a.year span{color:var(--muted);font-size:14px}
a.year:focus-visible{outline:3px solid #5ed3f3;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Gobble Gobble</h1>
  <p>Thanksgiving cookbooks, one per year.</p>
  <div class="years">
    <a class="year" href="2026/"><b>2026</b><span>14 dishes, game plan, deals and order options</span></a>
  </div>
</main>
</body>
</html>
